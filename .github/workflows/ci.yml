name: Vérification (build)

# Construit le site sur chaque pull request (dont celles de Dependabot) sans le déployer.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installation des dépendances
        run: npm ci
      - name: Construction du site et du PDF du CV
        run: npm run build
        env:
          CI: true
      - name: Contrôles de sortie
        run: |
          test -f dist/index.html
          test -f dist/cv-fabrice-dujardin.pdf
          test -f dist/sitemap-index.xml
          grep -q 'content-security-policy' dist/index.html
          echo "OK : $(find dist -name index.html | wc -l) pages, PDF et sitemap présents, CSP en place"
